[project]
name = "kestrel-fraud"
version = "1.1.0"
description = "Warranty-claim fraud scoring for Kestrel Home: model, scoring API and review list"
readme = "README.md"
requires-python = ">=3.11"
# Exact, tested versions are pinned in requirements.txt
dependencies = [
    "numpy>=2.0", "pandas>=2.2", "scikit-learn>=1.6", "scipy>=1.13", "statsmodels>=0.14",
    "joblib>=1.4", "fastapi>=0.110", "uvicorn>=0.30", "pydantic>=2.5", "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools]
packages = ["kestrel_fraud"]

[tool.setuptools.package-data]
kestrel_fraud = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
markers = ["needs_model: needs the client data pack and a trained model"]
filterwarnings = ["ignore::DeprecationWarning:starlette.*", "ignore::DeprecationWarning:fastapi.*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731"]   # short lambdas are used for column readers and reason templates
